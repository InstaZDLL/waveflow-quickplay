[package]
name = "waveflow-quickplay"
version = "1.0.0"
description = "WaveFlow QuickPlay — a standalone, lightweight egui/eframe audio player built on WaveFlow's Rust audio infrastructure."
authors = ["InstaZDLL <github.105mh@8shield.net>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/InstaZDLL/waveflow-quickplay"
homepage = "https://waveflow.app"
publish = false

# The prototype lives next to the WaveFlow checkout and takes the portable
# crate by path. Promoting it to a workspace member later is a one-line
# move: `members = [..., "crates/quickplay"]` in `src-tauri/Cargo.toml` and
# `path = "../core"` here. It is kept outside for now so the desktop app's
# `Cargo.lock` (and the Flatpak sources generated from it) stay untouched
# while egui / eframe are being evaluated.

[dependencies]
# ── WaveFlow shared infrastructure ───────────────────────────────────────
# `waveflow-core`: the one codec registry (`audio_format::opus::codecs()`,
# symphonia + libopus), the DSD parser + PCM converter, the scanner's tag /
# cover / probe helpers and `AUDIO_EXTENSIONS`. Default features keep Opus
# on, which builds the vendored libopus and therefore needs cmake — the same
# requirement the desktop app already has. `sqlite` / `plugins` are left
# off: no database, no plugin host in QuickPlay.
# Pinned to a WaveFlow commit so the build is reproducible without a checkout
# next door; bump the `rev` to pick up core changes. For local work against
# a WaveFlow checkout, override it from the command line:
#   cargo build --config 'patch."https://github.com/InstaZDLL/WaveFlow".waveflow-core.path="../WaveFlow/src-tauri/crates/core"'
waveflow-core = { git = "https://github.com/InstaZDLL/WaveFlow", rev = "75bd2b6918ef35821def921e209d483388f27d30" }

# ── UI ──────────────────────────────────────────────────────────────────
# glow (OpenGL) rather than wgpu: a smaller dependency tree, a faster cold
# start and no shader-compiler lookups — the footprint is the point of the
# prototype. `default_fonts` ships egui's bundled Latin fonts.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36"

# ── Audio pipeline (the same crates and versions the desktop engine uses) ─
cpal = "0.18"
rtrb = "0.4"
rubato = "5.0"
# FFT for the spectrum visualizer, the same wrapper the desktop uses.
realfft = "3"
crossbeam-channel = "0.5"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "aiff",
    "vorbis",
    "ogg",
    "aac",
    "alac",
    "isomp4",
    "pcm",
    "all-meta",
] }

# ── Metadata + artwork ──────────────────────────────────────────────────
# lofty is reached through `waveflow_core::scanner::extract::read_tagged_file`,
# which returns a `lofty::file::TaggedFile`; the crate is named here only to
# call methods on that value (same minor as core, so one build).
lofty = "0.25"
# Cover bytes → RGBA for the egui texture. Same feature set as core.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
    "tiff",
] }

# ── Desktop glue ────────────────────────────────────────────────────────
# The XDG portal backend on Linux (the desktop's own dialog, no GTK linked,
# Flatpak-friendly); the common-controls dialog on Windows.
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "wayland",
    "common-controls-v6",
] }
dirs = "7"
# Single instance: a second launch hands its files to the running player
# over a local socket (named pipe on Windows, Unix socket elsewhere).
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# Owner relationship between the playlist window and the player (one taskbar
# button, minimized together); same version winit already pulls.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

[build-dependencies]
# Embeds the icon + VERSIONINFO into the Windows executable only; a no-op
# elsewhere (see build.rs).
winresource = "0.1"

[profile.dev]
opt-level = 1

# Decoders, the resampler and the DSD FIR are far too slow unoptimised to
# keep a 48 kHz ring fed; the desktop app has the same problem in `tauri dev`.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# ── Installers (cargo-packager) ─────────────────────────────────────────
# `cargo packager --release --formats nsis` on Windows, `--formats deb,appimage`
# on Linux. The NSIS installer is per user, no administrator rights, and runs
# `--register` / `--unregister` (packaging/installer.nsi); the Linux packages
# carry the desktop entry with the audio MIME types (packaging/quickplay.desktop).
[package.metadata.packager]
product-name = "WaveFlow QuickPlay"
identifier = "app.waveflow.quickplay"
publisher = "InstaZDLL"
category = "Music"
icons = ["assets/icon.ico", "assets/icon-128.png"]
out-dir = "target/packager"
before-packaging-command = "cargo build --release"
binaries = [{ path = "waveflow-quickplay", main = true }]
license-file = "LICENSE"
resources = [{ src = "LICENSE", target = "LICENSE.txt" }]

[package.metadata.packager.nsis]
template = "packaging/installer.nsi"
installer-icon = "assets/icon.ico"
installer-mode = "currentUser"
languages = ["English", "French"]
display-language-selector = false

[package.metadata.packager.deb]
package-name = "waveflow-quickplay"
desktop-template = "packaging/quickplay.desktop"
depends = ["libasound2 | libasound2t64", "libxkbcommon0", "libwayland-client0", "libgl1"]
section = "sound"

# .rpm for Fedora / RHEL / openSUSE, built by cargo-generate-rpm from the
# release binary (cargo-packager has no rpm format). Dependencies are listed
# as soname capabilities; file triggers of desktop-file-utils
# and hicolor-icon-theme refresh the caches, so no scriptlet is needed.
[package.metadata.generate-rpm]
name = "waveflow-quickplay"
summary = "A small, fast, native music player: double-click a file, hear it now"
license = "GPL-3.0-only"
url = "https://github.com/InstaZDLL/waveflow-quickplay"
auto-req = "no"
assets = [
    { source = "target/release/waveflow-quickplay", dest = "/usr/bin/waveflow-quickplay", mode = "755" },
    { source = "packaging/app.waveflow.quickplay.desktop", dest = "/usr/share/applications/app.waveflow.quickplay.desktop", mode = "644" },
    { source = "assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/app.waveflow.quickplay.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/waveflow-quickplay/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/waveflow-quickplay/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
# Soname capabilities, as rpm itself would derive them: only libasound is
# linked; wayland, xkbcommon and EGL/GL are dlopen-ed at run time, so they
# are named here, the way they are provided (alsa-lib, libwayland-client,
# libxkbcommon, libglvnd-egl, libglvnd-glx on Fedora).
"libasound.so.2()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
