[package]
name = "waveflow-quickplay"
version = "1.2.0"
description = "WaveFlow QuickPlay — a standalone, lightweight egui/eframe audio player built on WaveFlow's Rust audio infrastructure."
authors = ["InstaZDLL <github.105mh@8shield.net>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/InstaZDLL/waveflow-quickplay"
homepage = "https://waveflow.app"
publish = false

# The prototype lives next to the WaveFlow checkout and takes the portable
# crate by path. Promoting it to a workspace member later is a one-line
# move: `members = [..., "crates/quickplay"]` in `src-tauri/Cargo.toml` and
# `path = "../core"` here. It is kept outside for now so the desktop app's
# `Cargo.lock` (and the Flatpak sources generated from it) stay untouched
# while egui / eframe are being evaluated.

[dependencies]
# ── WaveFlow shared infrastructure ───────────────────────────────────────
# `waveflow-core`: the one codec registry (`audio_format::opus::codecs()`,
# symphonia + libopus), the DSD parser + PCM converter, the scanner's tag /
# cover / probe helpers and `AUDIO_EXTENSIONS`, and with the `playback`
# feature the decoding for playback itself (`playback::stream::ActiveStream`:
# open, decode to interleaved f32, channel-convert, resample, seek), the code
# the desktop engine plays through. Default features keep Opus on, which
# builds the vendored libopus and therefore needs cmake — the same
# requirement the desktop app already has. `sqlite` / `plugins` are left
# off: no database, no plugin host in QuickPlay.
# Pinned to a WaveFlow commit so the build is reproducible without a checkout
# next door; bump the `rev` to pick up core changes. For local work against
# a WaveFlow checkout, override it from the command line:
#   cargo build --config 'patch."https://github.com/InstaZDLL/WaveFlow".waveflow-core.path="../WaveFlow/src-tauri/crates/core"'
waveflow-core = { git = "https://github.com/InstaZDLL/WaveFlow", rev = "3094f989fd9735267eef3610f82b9dc4aa6f856f", features = [
    "playback",
] }

# ── UI ──────────────────────────────────────────────────────────────────
# glow (OpenGL) rather than wgpu: a smaller dependency tree, a faster cold
# start and no shader-compiler lookups — the footprint is the point of the
# prototype. `default_fonts` ships egui's bundled Latin fonts.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36"
# The font parser egui itself uses (same version, so one build): a system
# fallback font is checked with it before egui is given the file, since
# egui panics on one it cannot read.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

# ── Audio transport (the same crates and versions the desktop engine uses) ─
# Decoding, channel conversion and resampling come from `waveflow-core`
# (symphonia, rubato); these carry the samples to the device.
cpal = "0.18"
rtrb = "0.4"
# FFT for the spectrum visualizer, the same wrapper the desktop uses.
realfft = "3"
crossbeam-channel = "0.5"

# ── Metadata + artwork ──────────────────────────────────────────────────
# lofty is reached through `waveflow_core::scanner::extract::read_tagged_file`,
# which returns a `lofty::file::TaggedFile`; the crate is named here only to
# call methods on that value (same minor as core, so one build).
lofty = "0.25"
# Cover bytes → RGBA for the egui texture. Same feature set as core.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
    "tiff",
] }

# ── Desktop glue ────────────────────────────────────────────────────────
# The XDG portal backend on Linux (the desktop's own dialog, no GTK linked,
# Flatpak-friendly); the common-controls dialog on Windows.
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "wayland",
    "common-controls-v6",
] }
dirs = "7"
# Single instance: a second launch hands its files to the running player
# over a local socket (named pipe on Windows, Unix socket elsewhere).
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Updates (src/update.rs): the manifest and the package over HTTPS with the
# client waveflow-core already builds (blocking, rustls, its features), the
# version compared as semver, the package checked against the release key.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
semver = "1"
minisign-verify = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# Owner relationship between the playlist window and the player (one taskbar
# button, minimized together), the registry, the version resource of an
# installed WaveFlow, who runs the other end of the single-instance pipe and
# whether it holds data yet;
# same version winit already pulls.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Pipes",
] }

[target.'cfg(unix)'.dependencies]
# `geteuid`: the single-instance socket checks who is at the other end on
# the Linux abstract namespace, and who owns the directory it lives in.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# `with_x11`: pinned in a Wayland session, QuickPlay runs under XWayland
# (src/restart.rs); the winit version eframe already pulls.
winit = { version = "0.30", default-features = false }
# Whether XWayland answers before choosing it, opened as winit opens it;
# the version winit already pulls.
x11-dl = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Files opened from Finder arrive as `application:openURLs:` on the
# application delegate (src/macos.rs): the event loop is built here so the
# method can be added to winit's delegate before it starts, with the winit
# and objc2 versions eframe already pulls.
winit = { version = "0.30", default-features = false }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSArray",
    "NSEnumerator",
    "NSString",
    "NSURL",
] }

[build-dependencies]
# Embeds the icon + VERSIONINFO into the Windows executable only; a no-op
# elsewhere (see build.rs).
winresource = "0.1"

[profile.dev]
opt-level = 1

# Decoders, the resampler and the DSD FIR are far too slow unoptimised to
# keep a 48 kHz ring fed; the desktop app has the same problem in `tauri dev`.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# ── Installers (cargo-packager) ─────────────────────────────────────────
# `cargo packager --release --formats nsis` on Windows, `--formats deb,appimage`
# on Linux. The NSIS installer is per user, no administrator rights, and runs
# `--register` / `--unregister` (packaging/installer.nsi); the Linux packages
# carry the desktop entry with the audio MIME types (packaging/quickplay.desktop).
# It packages the binary already built: run `cargo build --release --locked`
# first. No build hook here, so the release workflow compiles everything
# before the signing certificate is imported and nothing compiles after.
[package.metadata.packager]
product-name = "WaveFlow QuickPlay"
identifier = "app.waveflow.quickplay"
publisher = "InstaZDLL"
category = "Music"
icons = ["assets/icon.ico", "assets/icon-128.png"]
out-dir = "target/packager"
binaries = [{ path = "waveflow-quickplay", main = true }]
license-file = "LICENSE"
resources = [{ src = "LICENSE", target = "LICENSE.txt" }]

[package.metadata.packager.nsis]
template = "packaging/installer.nsi"
installer-icon = "assets/icon.ico"
installer-mode = "currentUser"
languages = ["English", "French"]
display-language-selector = false

[package.metadata.packager.deb]
package-name = "waveflow-quickplay"
desktop-template = "packaging/quickplay.desktop"
depends = ["libgcc-s1", "libasound2 | libasound2t64", "libxkbcommon0", "libwayland-client0", "libegl1", "libgl1", "libx11-6", "libx11-xcb1", "libxcursor1", "libxi6", "libxkbcommon-x11-0"]
section = "sound"
