name: Bug report
description: Something works incorrectly in QuickPlay — crash, wrong behaviour, a file that does not play.
title: "bug: <one-line summary>"
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Repro steps and the exact version make the difference between "fixed in a day" and "lingers for months".

        Security issues: please **do not** open a public issue. See [`.github/SECURITY.md`](https://github.com/InstaZDLL/waveflow-quickplay/blob/main/.github/SECURITY.md) for the disclosure channel.
        A bug in WaveFlow Desktop (library, EQ, scrobbling…) belongs in the [WaveFlow repository](https://github.com/InstaZDLL/WaveFlow/issues/new/choose).

  - type: input
    id: version
    attributes:
      label: QuickPlay version
      description: From the settings page (gear in the title bar) or `waveflow-quickplay --version`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (GNOME on Wayland)
        - Linux (KDE Plasma on Wayland)
        - Linux (X11 — any desktop)
        - Linux (other, specify below)
        - macOS (Apple Silicon, built from source)
        - macOS (Intel, built from source)
        - Other (specify in the steps)
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install QuickPlay?
      options:
        - GitHub Releases (Windows installer .exe)
        - GitHub Releases (.deb)
        - GitHub Releases (.AppImage)
        - Built from source (`cargo build --release`)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Playback (no sound, glitches, wrong duration, a file that fails)
        - Window (title bar, resize, artwork mode, HiDPI)
        - Playlist window (docking, minimize / restore, taskbar)
        - Lyrics (.lrc timing or display)
        - File-manager integration (context menu, "Open with", second launch)
        - Settings / languages
        - Installer / packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug — what you expected vs what actually happened.
      placeholder: |
        Expected: double-clicking the FLAC in Explorer opens QuickPlay and plays it.
        Actual: the window opens, the title shows, nothing plays and the status line says "Cannot play: …".
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps a stranger could follow on a fresh install.
      placeholder: |
        1. Install QuickPlay 1.0.0 with the Windows installer.
        2. Right-click a 24-bit FLAC → "Play with WaveFlow QuickPlay".
        3. Observe the status line.
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: The audio file, when the bug is about one
      description: Codec, sample rate, bit depth, channels, length, where it comes from, and whether other players open it. Attach a small sample if you can share one (drag-and-drop here).
      placeholder: "FLAC 96 kHz / 24-bit stereo, 6 min, ripped with dBpoweramp; plays in foobar2000."

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Run QuickPlay from a terminal with `RUST_LOG=debug` (PowerShell: `$env:RUST_LOG="debug"; .\waveflow-quickplay.exe file.flac`) and paste the lines around the bug.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (drag-and-drop here), multi-monitor / scaling, audio device, whether WaveFlow Desktop is installed too.
